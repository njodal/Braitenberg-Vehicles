<text x="210.0" y="410.0" text-anchor="middle" font-size="11" fill="#6b7280">Neighboring detectors share pixels, as in the book's figure 12.</text>
<text x="210.0" y="425.0" text-anchor="middle" font-size="11" fill="#6b7280">Only a thing that fills a whole square fires one:</text>
<text x="210.0" y="440.0" text-anchor="middle" font-size="11" fill="#6b7280">scattered small things do not, however many there are.</text>
<text x="680.0" y="66.0" text-anchor="middle" font-size="13" fill="#6b7280" font-style="italic">An example image, and which detectors fire</text>
