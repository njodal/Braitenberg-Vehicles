<text x="680.0" y="260.0" text-anchor="middle" font-size="11" fill="#6b7280">Uniform stretches (0 to 1, 4 to 8) are subdued: inhibition</text>
<text x="680.0" y="275.0" text-anchor="middle" font-size="11" fill="#6b7280">from their neighbors cancels their own excitation. The</text>
<text x="680.0" y="290.0" text-anchor="middle" font-size="11" fill="#6b7280">isolated spot (11) stands out.</text>
<text x="680.0" y="305.0" text-anchor="middle" font-size="11" fill="#6b7280"></text>
<text x="680.0" y="320.0" text-anchor="middle" font-size="11" fill="#6b7280">front keeps one point per thing, its left end, however wide</text>
<text x="680.0" y="335.0" text-anchor="middle" font-size="11" fill="#6b7280">the thing is: what a movement detector needs. At the border</text>
<text x="680.0" y="350.0" text-anchor="middle" font-size="11" fill="#6b7280">the missing neighbor counts as dark, so front[0] fires: the</text>
<text x="680.0" y="365.0" text-anchor="middle" font-size="11" fill="#6b7280">difficulty at the borders that the book mentions.</text>
