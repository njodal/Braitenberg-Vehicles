name: Room
description: A walled room with blocks and two short walls in it. Infrared sensors read the proximity field of every surface.

arena:
  width: 100
  height: 100
  edges: bounce

obstacles:
  # The four walls of the room.
  - box: {position: [50, 1], length: 100, width: 2}
  - box: {position: [50, 99], length: 100, width: 2}
  - box: {position: [1, 50], length: 100, width: 2, heading: 90}
  - box: {position: [99, 50], length: 100, width: 2, heading: 90}
  # Blocks and short walls inside.
  - box: {position: [28, 30], length: 10, width: 10}
  - box: {position: [72, 70], length: 14, width: 6, heading: 30}
  - box: {position: [26, 74], length: 8, width: 8, heading: 15}
  - box: {position: [74, 28], length: 16, width: 3, heading: -40}
  - box: {position: [50, 52], length: 24, width: 2, heading: 90}

stimuli:
  proximity:            # what infrared sensors read: high near any surface
    sources: []
    surfaces:
      intensity: 10
      falloff: 2
