name: Hot lamp
description: Two lamps 40 units apart. The right one is red, and it is hot for 120 seconds, then cold for 120, and so on.

arena:
  width: 100
  height: 100
  edges: wrap

stimuli:
  light:                    # both lamps shine
    sources:
      - position: [30, 50]
        intensity: 10
        falloff: 15
      - position: [70, 50]
        intensity: 10
        falloff: 15
  red:                      # the right lamp is red, always
    sources:
      - position: [70, 50]
        intensity: 10
        falloff: 15
  temperature:              # and hot only part of the time; heat is felt only close to it
    sources:
      - position: [70, 50]
        intensity: 10
        falloff: 4
        schedule: {period: 240, on_at: 0, off_at: 120}
