name: Two lamps
description: >-
  A dim lamp and a bright one, which take turns: the dim one is on from 10 to 30 s of every 100,
  the bright one from 50 to 70 (Vehicle 12, the distracted dreamer).

arena:
  width: 100
  height: 100
  edges: wrap

stimuli:
  light:
    sources:
      - position: [25, 50]    # the dim lamp
        intensity: 4
        falloff: 15
        schedule: {period: 100, on_at: 10, off_at: 30}
      - position: [75, 50]    # the bright lamp
        intensity: 20
        falloff: 15
        schedule: {period: 100, on_at: 50, off_at: 70}
