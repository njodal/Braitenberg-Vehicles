name: Green field
description: >-
  An empty field where green vehicles graze (Vehicle 13). Nothing in it shines: cameras see
  vehicles by their colors, and every vehicle's body adds to the proximity field, which is what
  infrared sensors and touch read.

arena:
  width: 100
  height: 100
  edges: wrap

stimuli:
  green:            # the color of the grazers and the bully
    sources: []
  blue:             # the color of the once-bitten vehicle, which the bully looks for
    sources: []
  proximity:        # nearness of other vehicles' bodies: 10 inside one, 5 at 2 from it
    sources: []
    surfaces:
      intensity: 10
      falloff: 2
