general:
  type: '6'
  name: Forager (evolved)
  description: Forager evolved by forager.yaml, seed 0, generation 30.
  size: 4
  noise_std: 0.1
sensors:
- sensor:
    name: left_eye
    type: light
    position: [-0.9, 0.9]
- sensor:
    name: right_eye
    type: light
    position: [0.9, 0.9]
- sensor:
    name: energy
    type: energy
    position: [0, -0.8]
energy:
  initial: 50
  max: 100
  consumption: 0.5
  basal: 2
  charge_from: light
  charge_gain: 2
units:
- unit:
    name: osc_a
    type: threshold
    threshold: 0
    delay: 0.31810564573532807
    position: [0, 0.2]
    inputs:
    - input:
        from: osc_c
        type: inhibitory
- unit:
    name: osc_b
    type: threshold
    threshold: 0
    delay: 0.31810564573532807
    position: [0.35, -0.02]
    inputs:
    - input:
        from: osc_a
        type: inhibitory
- unit:
    name: osc_c
    type: threshold
    threshold: 0
    delay: 0.31810564573532807
    position: [-0.35, -0.02]
    inputs:
    - input:
        from: osc_b
        type: inhibitory
    - input:
        from: osc_a
- unit:
    name: sees
    type: threshold
    threshold: 0.9873654041424272
    position: [0, 0.55]
    inputs:
    - input:
        from: left_eye
    - input:
        from: right_eye
- unit:
    name: left_brighter
    type: threshold
    threshold: 0.01
    position: [-0.5, 0.55]
    inputs:
    - input:
        from: left_eye
    - input:
        from: right_eye
        type: inhibitory
- unit:
    name: right_brighter
    type: threshold
    threshold: 0.01
    position: [0.5, 0.55]
    inputs:
    - input:
        from: right_eye
    - input:
        from: left_eye
        type: inhibitory
- unit:
    name: charged
    type: threshold
    threshold: 86.12901088054335
    position: [0.75, 0.25]
    inputs:
    - input:
        from: energy
- unit:
    name: hungry
    type: threshold
    threshold: -35.97254220852793
    position: [-0.75, 0.25]
    inputs:
    - input:
        from: energy
        type: inhibitory
- unit:
    name: full
    type: threshold
    threshold: 1
    position: [0.75, -0.02]
    inputs:
    - input:
        from: charged
    - input:
        from: full
    - input:
        from: hungry
        type: inhibitory
- unit:
    name: seeking
    type: threshold
    threshold: 1
    position: [-0.75, -0.02]
    inputs:
    - input:
        from: sees
    - input:
        from: full
        type: inhibitory
- unit:
    name: zig
    type: threshold
    threshold: 1
    position: [0.27, -0.35]
    inputs:
    - input:
        from: osc_b
    - input:
        from: seeking
        type: inhibitory
- unit:
    name: zag
    type: threshold
    threshold: 1
    position: [-0.27, -0.35]
    inputs:
    - input:
        from: osc_c
    - input:
        from: seeking
        type: inhibitory
- unit:
    name: seek_left
    type: threshold
    threshold: 2
    position: [0.8, -0.35]
    inputs:
    - input:
        from: left_brighter
    - input:
        from: seeking
- unit:
    name: seek_right
    type: threshold
    threshold: 2
    position: [-0.8, -0.35]
    inputs:
    - input:
        from: right_brighter
    - input:
        from: seeking
actuators:
- actuator:
    name: left_motor
    type: motor
    position: [-0.5, -0.7]
    inputs:
    - input:
        from: zag
    - input:
        from: seek_right
    gain: 3.335683216685162
    base_speed: 3.136627107857716
    max_speed: 5.620714133686235
- actuator:
    name: right_motor
    type: motor
    position: [0.5, -0.7]
    inputs:
    - input:
        from: zig
    - input:
        from: seek_left
    gain: 3.335683216685162
    base_speed: 3.136627107857716
    max_speed: 5.620714133686235
