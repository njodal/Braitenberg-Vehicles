general:
  type: "3a"
  name: Love
  description: Each sensor slows the motor on its own side, so the vehicle turns toward the source, slows down as it gets close and comes to rest facing it.
  size: 4
  noise_std: 0.1

sensors:
  - sensor:
      name: left_eye
      type: light
      position: [-0.9, 0.9]
  - sensor:
      name: right_eye
      type: light
      position: [0.9, 0.9]

actuators:
  - actuator:
      name: left_motor
      type: motor
      position: [-0.5, -0.6]
      inputs:
        - input:
            from: left_eye
            type: inhibitory
      gain: 0.6
      base_speed: 5
      max_speed: 5
  - actuator:
      name: right_motor
      type: motor
      position: [0.5, -0.6]
      inputs:
        - input:
            from: right_eye
            type: inhibitory
      gain: 0.6
      base_speed: 5
      max_speed: 5

units: []
