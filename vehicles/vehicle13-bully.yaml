general:
  type: "13"
  name: Bully
  description: >-
    A green vehicle that looks like a grazer, but rams the once-bitten vehicle: the Vehicle 9
    chaser, which follows the blue it sees. It has no infrared sensors, so nothing stops it.
  size: 4
  height: 2
  noise_std: 0.3

appearance:
  green: 10
  blue: 0

sensors:
  - sensor:
      name: eye
      type: blue
      position: [0, 0.88]
      field_of_view: 90
      camera:
        columns: 18               # 5 degrees each
        rows: 1
        vertical_field_of_view: 10
        height: 1
        range: 25
      response:
        type: step                # lit where the once-bitten vehicle covers a tenth of a pixel or more
        at: 1

actuators:
  # Crossed: more of it on the left speeds up the right motor, and turns the bully left.
  - actuator:
      name: left_motor
      type: motor
      position: [-0.5, -0.7]
      base_speed: 2
      gain: 1
      max_speed: 4
      inputs:
        - input:
            from: eye[0, 9:18]
  - actuator:
      name: right_motor
      type: motor
      position: [0.5, -0.7]
      base_speed: 2
      gain: 1
      max_speed: 4
      inputs:
        - input:
            from: eye[0, 0:9]
