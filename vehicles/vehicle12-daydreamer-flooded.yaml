general:
  type: "12"
  name: Daydreamer, flooded
  description: >-
    The daydreamer's ideas with a low threshold and no control. One idea fires two, and soon all of them are on for good, so it drives straight ahead forever.
  size: 4
  noise_std: 0              # no noise: whatever it does comes from its ideas

sensors: []                 # nothing to sense: it thinks in the dark

units:
  # One pulse at the start of the run, to set the first idea going
  - unit:
      name: wake
      type: threshold
      position: [-0.85, 0.85]
      threshold: 0          # fires on its own ...
      delay: 1
      inputs:
        - input:
            from: awake     # ... until awake stops it
            type: inhibitory
  - unit:
      name: awake
      type: threshold
      position: [-0.55, 0.85]
      threshold: 1
      inputs:
        - input:
            from: wake
        - input:
            from: awake     # and stays on
  # Eight ideas around a ring, each exciting the next one and the one three places on
  # idea_0: forward
  - unit:
      name: idea_0
      type: threshold
      position: [0.0, 0.7]
      threshold: 1
      delay: 1              # each idea lasts about a second: long enough to see its gesture
      inputs:
        - input:
            from: idea_7     # the previous idea
        - input:
            from: idea_5     # and the one three places back
        - input:
            from: wake        # the start pulse
        - input:
            from: idea_0     # itself, inhibitory: an idea fires once, for one delay
            type: inhibitory
  # idea_1: turn left
  - unit:
      name: idea_1
      type: threshold
      position: [0.35, 0.55]
      threshold: 1
      delay: 1
      inputs:
        - input:
            from: idea_0
        - input:
            from: idea_6
        - input:
            from: idea_1
            type: inhibitory
  # idea_2: turn right
  - unit:
      name: idea_2
      type: threshold
      position: [0.5, 0.2]
      threshold: 1
      delay: 1
      inputs:
        - input:
            from: idea_1
        - input:
            from: idea_7
        - input:
            from: idea_2
            type: inhibitory
  # idea_3: stop
  - unit:
      name: idea_3
      type: threshold
      position: [0.35, -0.15]
      threshold: 1
      delay: 1
      inputs:
        - input:
            from: idea_2
        - input:
            from: idea_0
        - input:
            from: idea_3
            type: inhibitory
  # idea_4: forward
  - unit:
      name: idea_4
      type: threshold
      position: [0.0, -0.3]
      threshold: 1
      delay: 1
      inputs:
        - input:
            from: idea_3
        - input:
            from: idea_1
        - input:
            from: idea_4
            type: inhibitory
  # idea_5: turn left
  - unit:
      name: idea_5
      type: threshold
      position: [-0.35, -0.15]
      threshold: 1
      delay: 1
      inputs:
        - input:
            from: idea_4
        - input:
            from: idea_2
        - input:
            from: idea_5
            type: inhibitory
  # idea_6: turn right
  - unit:
      name: idea_6
      type: threshold
      position: [-0.5, 0.2]
      threshold: 1
      delay: 1
      inputs:
        - input:
            from: idea_5
        - input:
            from: idea_3
        - input:
            from: idea_6
            type: inhibitory
  # idea_7: stop
  - unit:
      name: idea_7
      type: threshold
      position: [-0.35, 0.55]
      threshold: 1
      delay: 1
      inputs:
        - input:
            from: idea_6
        - input:
            from: idea_4
        - input:
            from: idea_7
            type: inhibitory

actuators:
  # Gestures: idea_0 and idea_4 forward, idea_1 and idea_5 turn left,
  # idea_2 and idea_6 turn right, idea_3 and idea_7 stop
  - actuator:
      name: left_motor
      type: motor
      position: [-0.8, -0.75]
      gain: 2
      inputs:
        - input:
            from: idea_0
        - input:
            from: idea_2
        - input:
            from: idea_4
        - input:
            from: idea_6
  - actuator:
      name: right_motor
      type: motor
      position: [0.8, -0.75]
      gain: 2
      inputs:
        - input:
            from: idea_0
        - input:
            from: idea_1
        - input:
            from: idea_4
        - input:
            from: idea_5
