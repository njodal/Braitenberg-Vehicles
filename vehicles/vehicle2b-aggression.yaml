general:
  type: "2b"
  name: Aggression
  description: Each sensor drives the motor on the opposite side, so the vehicle turns toward the source and speeds into it.
  size: 4
  noise_std: 0.1

sensors:
  - sensor:
      name: left_eye
      type: light
      position: [-0.9, 0.9]
  - sensor:
      name: right_eye
      type: light
      position: [0.9, 0.9]

actuators:
  - actuator:
      name: left_motor
      type: motor
      position: [-0.5, -0.6]
      inputs:
        - input:
            from: right_eye    # crossed wiring
      max_speed: 10
  - actuator:
      name: right_motor
      type: motor
      position: [0.5, -0.6]
      inputs:
        - input:
            from: left_eye
      max_speed: 10

units: []
