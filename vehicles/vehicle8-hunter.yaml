general:
  type: "8"
  name: Hunter
  description: Watches a field of lamps and sees only what moves; turns toward it and lunges when it is ahead, without looking while it moves. When nothing moves for a while, it wanders.
  size: 4
  noise_std: 0

sensors:
  - sensor:
      name: retina
      type: light
      position: [0, 0.88]
      field_of_view: 180
      camera:
        columns: 24                 # 7.5 degrees each
        rows: 4                     # 2 degrees each: two above the horizon, two below
        vertical_field_of_view: 8
        height: 1
        range: 30
      response:
        type: step                  # lit: a thing fills about a third of the pixel
        at: 3

actuators:
  - actuator:
      name: left_motor
      type: motor
      position: [-0.5, -0.88]
      gain: 3
      max_speed: 6
      inputs:
        - input:
            from: pursue.turn_right
        - input:
            from: pursue.forward
        - input:
            from: pursue.forward      # twice: lunges at 6, turns at 3
  - actuator:
      name: right_motor
      type: motor
      position: [0.5, -0.88]
      gain: 3
      max_speed: 6
      inputs:
        - input:
            from: pursue.turn_left
        - input:
            from: pursue.forward
        - input:
            from: pursue.forward

units:
  # Object detectors (Braitenberg's figure 12): a square of four lit pixels.
  - unit:
      name: object
      type: threshold
      threshold: 4
      array: [3, 23]
      position: [0, 0.6]
      inputs:
        - input:
            from: retina[i, j]
        - input:
            from: retina[i, j+1]
        - input:
            from: retina[i+1, j]
        - input:
            from: retina[i+1, j+1]
  # An object in column i, whatever its row.
  - unit:
      name: lump
      type: threshold
      threshold: 1
      array: 23
      position: [0, 0.38]
      inputs:
        - input:
            from: object[:, i]
  # Lateral inhibition from the left (figure 14, one-sided): the object's left end.
  - unit:
      name: front
      type: threshold
      threshold: 1
      array: 23
      position: [-0.34, 0.16]
      inputs:
        - input:
            from: lump[i]
        - input:
            from: lump[i-1]
            type: inhibitory
        - input:
            from: acting            # blind while moving
            type: inhibitory
  # Movement detectors (figure 13): a sluggish copy of each point, and its neighbor now.
  - unit:
      name: slow
      type: threshold
      threshold: 1
      delay: 0.3
      array: 23
      position: [0.36, 0.16]
      inputs:
        - input:
            from: front[i]
  - unit:
      name: right
      type: threshold
      threshold: 2
      array: 22
      position: [-0.36, -0.06]
      inputs:
        - input:
            from: slow[i]
        - input:
            from: front[i+1]
  - unit:
      name: left
      type: threshold
      threshold: 2
      array: 22
      position: [0.36, -0.06]
      inputs:
        - input:
            from: slow[i+1]
        - input:
            from: front[i]
  # Where the movement is.
  - unit:
      name: moves_left
      type: threshold
      threshold: 1
      position: [-0.36, -0.28]
      inputs:
        - input:
            from: right[0:8]
        - input:
            from: left[0:8]
  - unit:
      name: moves_ahead
      type: threshold
      threshold: 1
      position: [0, -0.28]
      inputs:
        - input:
            from: right[8:14]
        - input:
            from: left[8:14]
  - unit:
      name: moves_right
      type: threshold
      threshold: 1
      position: [0.36, -0.28]
      inputs:
        - input:
            from: right[14:22]
        - input:
            from: left[14:22]
  - unit:
      name: near
      type: threshold
      threshold: 3
      position: [0.74, -0.28]
      inputs:
        - input:
            from: lump[10:13]
  # On from when the hunter starts moving until it has stopped. Its delay is pursue's, so
  # that it comes on with the motors, and goes off once the eye has caught up.
  - unit:
      name: acting
      type: threshold
      threshold: 1
      delay: 0.1
      position: [0.78, -0.52]
      inputs:
        - input:
            from: moves_left
        - input:
            from: moves_ahead
        - input:
            from: moves_right
        - input:
            from: pursue.turn_left
        - input:
            from: pursue.turn_right
        - input:
            from: pursue.forward
        - input:
            from: wander.left       # so that it is blind from the start of a wandering turn
        - input:
            from: wander.right

modules:
  # Bored: nothing has moved for a while, and the hunter is still.
  - module:
      name: boredom
      file: ../modules/boredom.yaml
      position: [-0.66, -0.44]
      inputs:
        seen: [moves_left, moves_ahead, moves_right]
        busy: acting
  # Now and then, a short turn to one side, while bored.
  - module:
      name: wander
      file: ../modules/wander.yaml
      position: [-0.66, -0.66]
      inputs:
        enable: boredom.bored
  # Turn toward what moves, or toward the side wander picks; lunge when it is ahead.
  - module:
      name: pursue
      file: ../modules/pursue.yaml
      position: [0.12, -0.68]
      inputs:
        left: [moves_left, wander.left]
        ahead: moves_ahead
        right: [moves_right, wander.right]
        near: near
